<section class="page">
  <header class="page-header">
    <h1 class="page-title">Settings</h1>
  </header>

  <div class="settings-list">
    <div class="settings-item">
      <div class="settings-item-head">
        <span class="settings-item-label">Playback speed</span>
        <span class="settings-item-value">{{ playbackRate().toFixed(1) }}&times;</span>
      </div>

      <input
        class="settings-slider"
        type="range"
        data-no-tab-swipe
        [min]="minRate"
        [max]="maxRate"
        [step]="rateStep"
        [value]="playbackRate()"
        (input)="onPlaybackRateInput($event)"
      />

      <div class="settings-item-foot">
        <span>{{ minRate.toFixed(1) }}&times;</span>
        <button class="link-button" type="button" (click)="onPlaybackRateReset()">Reset</button>
        <span>{{ maxRate.toFixed(1) }}&times;</span>
      </div>
    </div>
  </div>

  <div class="settings-brand">
    <p class="settings-name">TTMomentViewer</p>
  </div>
</section>
