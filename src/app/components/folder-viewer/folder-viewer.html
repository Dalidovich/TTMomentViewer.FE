<div class="viewer">
  <button class="viewer-back" type="button" aria-label="Back" (click)="goBack()">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M14.5 5.5 8 12l6.5 6.5"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  <app-moment-feed
    [moments]="moments()"
    [startIndex]="startIndex()"
    [loading]="loading()"
    [failed]="failed()"
    [message]="message()"
    (reachStart)="onReachStart()"
    (reachEnd)="onReachEnd()"
    (retry)="onRetry()"
  />
</div>
