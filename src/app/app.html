<div
  class="app-shell"
  [class.app-shell-fullscreen]="fullscreenActive()"
  (touchstart)="onTouchStart($event)"
  (touchmove)="onTouchMove($event)"
  (touchend)="onTouchEnd($event)"
  (touchcancel)="onTouchCancel()"
>
  <div #tabView class="tab-view">
    <router-outlet />
  </div>
  @if (!fullscreenActive()) {
    <app-tab-bar />
  }
</div>
